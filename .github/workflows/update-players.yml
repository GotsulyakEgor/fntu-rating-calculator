name: Оновлення рейтингу ФНТУ

on:
  schedule:
    - cron: '17 4 * * *'   # щодня о 04:17 UTC
  workflow_dispatch:        # і вручну з вкладки Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-players.js
      - name: Закомітити зміни
        run: |
          if [ -n "$(git status --porcelain players.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add players.js
            git commit -m "Оновлено рейтинг ФНТУ"
            git push
          fi
